<!DOCTYPE html>
<html>
<head>
    <title>Redirecting... - EleenAI</title>
    <style>
        body {
            background: #0a0a1a;
            color: #e6e6ff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            border: 4px solid rgba(138, 43, 226, 0.3);
            border-top: 4px solid #8a2be2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Processing login...</h2>
        <p>You will be redirected back to EleenAI.</p>
    </div>
    
    <script>
        // Process auth callback
        function processCallback() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            
            const accessToken = params.get('access_token');
            const error = params.get('error');
            
            if (error) {
                console.error('Auth error:', error, params.get('error_description'));
                window.location.href = '/?error=' + encodeURIComponent(error);
                return;
            }
            
            if (accessToken) {
                // Success - redirect back to main page with tokens in hash
                window.location.href = '/#' + hash;
            } else {
                // No token found
                window.location.href = '/';
            }
        }
        
        // Run on page load
        window.addEventListener('load', processCallback);
        processCallback(); // Run immediately in case load already fired
    </script>
</body>
</html>
