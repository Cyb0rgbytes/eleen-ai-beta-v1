<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eleen AI Chat Assistant</title>
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Theme and language before first paint: a blocking same-origin script,
         because the module bundle below is deferred (web/public/prefs.js). -->
    <script src="/prefs.js"></script>
    <meta name="description" content="EleenAI, your gateway to the realm of artificial intelligence. Chat with an AI assistant powered by CSECNIX Technologies.">
    <link rel="preload" href="/logo.png" as="image">
    <link rel="preload" href="/scene-poster.webp" as="image" fetchpriority="high">

    <!-- The scene: the R2 asset host and the viewer's CDN. -->
    <link rel="preconnect" href="https://assets.eleenai.xyz" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>

    <!-- Clerk is the one script we do not build that loads on every page. It stays
         on clerk-js v5 (the v6 browser bundle has no sign-in UI). The Spline viewer
         is loaded by web/src/scene/spline.ts, and only when the live scene is shown. -->
    <script
        async
        crossorigin="anonymous"
        data-clerk-publishable-key="pk_live_Y2xlcmsuZWxlZW5haS54eXok"
        src="https://clerk.eleenai.xyz/npm/@clerk/clerk-js@5.128.0/dist/clerk.browser.js"
        type="text/javascript">
    </script>

    <!-- Everything else is ours, bundled and hashed by Vite from web/src. -->
    <script type="module" src="/src/main.ts"></script>
</head>
<body>
    <!-- The scene: a still poster at once, the live viewer when the device can afford it.
         Never filtered or tinted. aria-hidden: it is decoration. -->
    <div id="spline-bg" aria-hidden="true">
        <img id="scene-poster" src="/scene-poster.webp" alt="" width="1920" height="1080" decoding="async">
        <spline-viewer loading="eager" url="https://assets.eleenai.xyz/r_4_x_bot.splinecode"></spline-viewer>
    </div>

    <div id="spline-loader" aria-hidden="true">
        <span class="dot"></span>
        Loading 3D scene
    </div>

    <!-- Darkens only where the conversation sits. See web/src/styles/layers.css. -->
    <div id="chat-scrim" aria-hidden="true"></div>

    <!-- Auth holds the page corners, independent of the reading column. -->
    <div class="auth-container">
        <div id="user-info" hidden>
            <img id="user-avatar" alt="" hidden>
            <span id="user-name"></span>
        </div>
        <button id="login-button" class="auth-button" type="button">
            <span>Login</span>
        </button>
        <button id="signup-button" class="auth-button primary-cta" type="button">
            <span>Sign up for free</span>
        </button>
        <button id="logout-button" class="auth-button secondary" type="button" hidden>
            <span>Logout</span>
        </button>
    </div>

    <!-- A second entry point: the top pair is easy to miss mid-conversation. -->
    <div class="auth-dock" id="auth-dock">
        <button id="dock-signin" class="auth-button" type="button">
            <span>Sign in</span>
        </button>
        <button id="dock-signup" class="auth-button primary-cta" type="button">
            <span>Sign up for free</span>
        </button>
    </div>

    <!-- The conversation sidebar (M4.4): signed in only, filled by web/src/sidebar.
         The toggle comes after the panel so it paints above it in the same layer. -->
    <div id="sidebar-scrim" class="sidebar-scrim" hidden></div>
    <aside id="sidebar" class="sidebar" aria-label="Conversations" hidden></aside>
    <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="false" hidden>
        <span class="sr-only">Open conversations</span>
    </button>

    <div class="gateway-container">
        <header>
            <img src="/logo.png" class="logo-image" alt="EleenAI, your gateway to the realm of AI">
        </header>

        <main class="chat-container">
            <div id="chat-messages" class="chat-messages" aria-live="polite" aria-relevant="additions">
                <div class="message assistant-message">
                    <div class="ai-avatar" aria-hidden="true">E</div>
                    <div class="message-body" dir="auto">
                        <p>Welcome to EleenAI. Ask me anything, or describe an image and I'll generate it.</p>
                        <p><em>Sign in for unlimited access.</em></p>
                    </div>
                </div>
            </div>

            <div class="message-input">
                <div class="controls-row">
                    <!-- The model picker (DESIGN.md 7). web/src/chat/picker.ts fills the
                         listbox from /api/v1/models; the modes are its segmented control. -->
                    <div class="model-picker" id="model-picker">
                        <button class="model-trigger" id="model-trigger" type="button" aria-controls="model-popover">Fast</button>
                        <div class="model-popover" id="model-popover" hidden>
                            <div class="model-list" id="model-list" role="listbox"></div>
                            <div class="mode-segment" role="radiogroup" aria-label="Response mode">
                                <button class="mode-btn active" data-mode="balanced" type="button">Balanced</button>
                                <button class="mode-btn" data-mode="creative" type="button">Creative</button>
                                <button class="mode-btn" data-mode="logical" type="button">Logical</button>
                            </div>
                            <button class="model-keys-link" type="button" hidden></button>
                            <button class="model-keys-link model-privacy-link" type="button" hidden></button>
                        </div>
                    </div>
                    <!-- Compare (M5.4): 2 or 3 models side by side. web/src/chat/compare-toggle.ts. -->
                    <button id="compare-btn" type="button" title="Compare models" aria-pressed="false"><span class="compare-btn-label">Compare</span></button>
                    <button id="voice-out-btn" type="button" title="Spoken replies"><span class="voice-out-label">Spoken replies</span></button>
                    <button id="enhance-btn" type="button" title="Enhance prompt"><span class="sr-only">Enhance prompt</span></button>
                </div>
                <div class="input-row">
                    <textarea id="user-input" placeholder="Ask me anything... (sign in for unlimited access)" rows="1" aria-label="Message" autofocus></textarea>
                    <span id="mic-timer" class="mic-timer" aria-live="polite" hidden>0:00</span>
                    <button id="mic-button" type="button" title="Record voice" aria-pressed="false">
                        <span>Record voice</span>
                    </button>
                    <button id="send-button" type="button" title="Send">
                        <span>Send</span>
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <p>EleenAI &copy; 2026 &middot; Powered by CSECNIX Technologies &middot; <a href="/privacy">Privacy</a></p>
        </footer>
    </div>
</body>
</html>
