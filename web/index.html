<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eleen AI Chat Assistant</title>
    <meta name="description" content="EleenAI, your gateway to the realm of artificial intelligence. Chat with an AI assistant powered by CSECNIX Technologies.">
    <link rel="preload" href="/logo.png" as="image">

    <!-- The scene: the R2 asset host and the viewer's CDN. -->
    <link rel="preconnect" href="https://assets.eleenai.xyz" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <!-- Start the scene download before the viewer script has even run. -->
    <link rel="prefetch" href="https://assets.eleenai.xyz/r_4_x_bot.splinecode" as="fetch" crossorigin>

    <!-- The two scripts we do not build. Spline's viewer declares no licence, so
         it is not self-hosted; it is pinned to an exact version. Clerk stays on
         clerk-js v5 (the v6 browser bundle has no sign-in UI). -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.88/build/spline-viewer.js" fetchpriority="high"></script>
    <script
        async
        crossorigin="anonymous"
        data-clerk-publishable-key="pk_live_Y2xlcmsuZWxlZW5haS54eXok"
        src="https://clerk.eleenai.xyz/npm/@clerk/clerk-js@5.128.0/dist/clerk.browser.js"
        type="text/javascript">
    </script>

    <!-- Everything else is ours, bundled and hashed by Vite from web/src. -->
    <script type="module" src="/src/main.ts"></script>
</head>
<body>
    <!-- The scene, never filtered or tinted. aria-hidden: it is decoration. -->
    <div id="spline-bg" aria-hidden="true">
        <spline-viewer loading="eager" url="https://assets.eleenai.xyz/r_4_x_bot.splinecode"></spline-viewer>
    </div>

    <div id="spline-loader" aria-hidden="true">
        <span class="dot"></span>
        Loading 3D scene
    </div>

    <!-- Darkens only where the conversation sits. See web/src/styles/layers.css. -->
    <div id="chat-scrim" aria-hidden="true"></div>

    <!-- Auth holds the page corners, independent of the reading column. -->
    <div class="auth-container">
        <div id="user-info" hidden>
            <img id="user-avatar" alt="" hidden>
            <span id="user-name"></span>
        </div>
        <button id="login-button" class="auth-button" type="button">
            <span>Login</span>
        </button>
        <button id="signup-button" class="auth-button primary-cta" type="button">
            <span>Sign up for free</span>
        </button>
        <button id="logout-button" class="auth-button secondary" type="button" hidden>
            <span>Logout</span>
        </button>
    </div>

    <!-- A second entry point: the top pair is easy to miss mid-conversation. -->
    <div class="auth-dock" id="auth-dock">
        <button id="dock-signin" class="auth-button" type="button">
            <span>Sign in</span>
        </button>
        <button id="dock-signup" class="auth-button primary-cta" type="button">
            <span>Sign up for free</span>
        </button>
    </div>

    <div class="gateway-container">
        <header>
            <img src="/logo.png" class="logo-image" alt="EleenAI, your gateway to the realm of AI">
        </header>

        <main class="chat-container">
            <div id="chat-messages" class="chat-messages" aria-live="polite" aria-relevant="additions">
                <div class="message assistant-message">
                    <div class="ai-avatar" aria-hidden="true">E</div>
                    <div class="message-body" dir="auto">
                        <p>Welcome to EleenAI. Ask me anything, or describe an image and I'll generate it.</p>
                        <p><em>Sign in for unlimited access.</em></p>
                    </div>
                </div>
            </div>

            <div class="typing-indicator" id="typing-indicator" role="status"></div>

            <div class="message-input">
                <div class="controls-row">
                    <div class="mode-selector" role="group" aria-label="Response mode">
                        <button class="mode-btn active" data-mode="balanced" type="button">Balanced</button>
                        <button class="mode-btn" data-mode="creative" type="button">Creative</button>
                        <button class="mode-btn" data-mode="logical" type="button">Logical</button>
                    </div>
                    <button id="enhance-btn" type="button" title="Enhance prompt"><span class="sr-only">Enhance prompt</span></button>
                </div>
                <div class="input-row">
                    <textarea id="user-input" placeholder="Ask me anything... (sign in for unlimited access)" rows="1" aria-label="Message" autofocus></textarea>
                    <span id="mic-timer" class="mic-timer" aria-live="polite" hidden>0:00</span>
                    <button id="mic-button" type="button" title="Record voice" aria-pressed="false">
                        <span>Record voice</span>
                    </button>
                    <button id="send-button" type="button" title="Send">
                        <span>Send</span>
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <p>EleenAI &copy; 2026 &middot; Powered by CSECNIX Technologies</p>
        </footer>
    </div>
</body>
</html>
